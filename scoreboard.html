<html lang="en">

    <style>
        /* Chọn TẤT CẢ các thẻ, kể cả trước và sau nó */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            /**
     * Màn hình chuẩn của bạn: 1440px
     * Bạn muốn tại màn 1440px này, 1rem = 16px (mức chuẩn của trình duyệt)
     * Công thức tính: (16px / 1440px) * 100 = 1.11111vw
     */
            font-size: 1.11111vw;
        }

        body {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
        }
    </style>
