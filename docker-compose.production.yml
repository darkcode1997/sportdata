x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres-primary:5432/${POSTGRES_DB:-sportdata}?schema=public&connection_limit=20&pool_timeout=20
  PORT: 4000
  FRONTEND_URL: https://${PUBLIC_DOMAIN:?}
  JWT_SECRET: ${JWT_SECRET:?}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  NODE_ENV: production
  ENABLE_SWAGGER: "false"
  SEED_DATABASE: "false"
  SEED_SEA_GAMES_DEMO: "false"
  RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-SportData <no-reply@localhost>}

x-backend: &backend
  image: sportdata-backend:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile.backend
  command: ["node", "apps/backend/dist/src/main.js"]
  environment: *backend-environment
  depends_on:
    database-migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-frontend: &frontend
  image: sportdata-frontend:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile.frontend
    args:
      API_INTERNAL_URL: http://backend-1:4000/api
      IMAGE_HOSTNAMES: ${IMAGE_HOSTNAMES:-images.unsplash.com,flagcdn.com}
  environment:
    NEXT_PUBLIC_API_URL: http://backend-1:4000/api
    NEXT_PUBLIC_APP_URL: https://${PUBLIC_DOMAIN:?}
    NEXT_TELEMETRY_DISABLED: 1
    NODE_ENV: production
  depends_on:
    backend-1: { condition: service_healthy }
    backend-2: { condition: service_healthy }
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportdata}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=1GB
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
    volumes:
      - postgres_primary:/var/lib/postgresql/data
      - postgres_wal:/wal_archive
      - ./deploy/postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sportdata}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-replica:
    image: postgres:16-alpine
    entrypoint: ["sh", "/scripts/start-replica.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?}
    volumes:
      - postgres_replica:/var/lib/postgresql/data
      - ./deploy/postgres/start-replica.sh:/scripts/start-replica.sh:ro
    depends_on:
      postgres-primary: { condition: service_healthy }
    restart: unless-stopped

  postgres-base-backup:
    image: postgres:16-alpine
    command: ["sh", "/scripts/base-backup.sh"]
    environment:
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgres_backups:/backups
      - ./deploy/postgres/base-backup.sh:/scripts/base-backup.sh:ro
    depends_on:
      postgres-primary: { condition: service_healthy }
    restart: unless-stopped

  database-migrate:
    image: sportdata-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    command:
      - sh
      - -c
      - npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres-primary:5432/${POSTGRES_DB:-sportdata}?schema=public
    depends_on:
      postgres-primary: { condition: service_healthy }
    restart: "no"

  backend-1:
    <<: *backend

  backend-2:
    <<: *backend

  frontend-1:
    <<: *frontend

  frontend-2:
    <<: *frontend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      frontend-1: { condition: service_healthy }
      frontend-2: { condition: service_healthy }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres-primary:5432/${POSTGRES_DB:-sportdata}?sslmode=disable
    depends_on:
      postgres-primary: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3002:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  postgres_primary:
  postgres_replica:
  postgres_wal:
  postgres_backups:
  prometheus_data:
  grafana_data:
