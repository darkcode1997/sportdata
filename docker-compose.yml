services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sportdata
      POSTGRES_USER: sportdata
      POSTGRES_PASSWORD: sportdata
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - sportdata_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportdata -d sportdata"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://sportdata:sportdata@postgres:5432/sportdata?schema=public
      PORT: 4000
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-3000}
      BACKEND_PUBLIC_URL: http://localhost:${BACKEND_HOST_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-sportdata-dev-secret-change-me-please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Seed is an explicit data operation. A normal restart must never rebuild
      # draws, matches or schedules that operators may already have edited.
      SEED_DATABASE: ${SEED_DATABASE:-false}
      SEED_SEA_GAMES_DEMO: ${SEED_SEA_GAMES_DEMO:-false}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-false}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-}
      ALLOW_DEMO_ACCOUNTS_IN_PRODUCTION: "false"
      NODE_ENV: ${NODE_ENV:-development}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sportdata.vn}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-SportData Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-SportData@ChangeMe2026!}
      ADMIN_ROLE: ${ADMIN_ROLE:-ADMIN}
      ADMIN_SYNC_PASSWORD: ${ADMIN_SYNC_PASSWORD:-false}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-SportData}
      TICKET_EMAIL_ENABLED: ${TICKET_EMAIL_ENABLED:-true}
      IDENTITY_OCR_ENABLED: ${IDENTITY_OCR_ENABLED:-false}
      FPT_AI_API_KEY: ${FPT_AI_API_KEY:-}
      FPT_AI_ID_ENDPOINT: ${FPT_AI_ID_ENDPOINT:-https://api.fpt.ai/vision/idr/vnm/}
      FPT_AI_PASSPORT_ENDPOINT: ${FPT_AI_PASSPORT_ENDPOINT:-https://api.fpt.ai/vision/passport/vnm}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      PAYMENT_SESSION_TTL_MINUTES: ${PAYMENT_SESSION_TTL_MINUTES:-30}
      UNPAID_REGISTRATION_TTL_HOURS: ${UNPAID_REGISTRATION_TTL_HOURS:-24}
      BANK_QR_ENABLED: ${BANK_QR_ENABLED:-true}
      MOMO_ENABLED: ${MOMO_ENABLED:-false}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_API_URL: ${MOMO_API_URL:-https://test-payment.momo.vn}
      MOMO_PARTNER_NAME: ${MOMO_PARTNER_NAME:-SportData}
      MOMO_STORE_ID: ${MOMO_STORE_ID:-SportData}
      VNPAY_ENABLED: ${VNPAY_ENABLED:-false}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    ports:
      - "${BACKEND_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/sports').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        API_INTERNAL_URL: http://backend:4000/api
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000/api
      NEXT_PUBLIC_APP_URL: http://localhost:${FRONTEND_HOST_PORT:-3000}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  sportdata_postgres:
